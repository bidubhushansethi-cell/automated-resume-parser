<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}TalentScan{% endblock %} · TalentScan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body data-page="{{ page|default('') }}">
<div class="app-shell">
  <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar" aria-label="Main navigation">
    <div class="sidebar-inner">
      <a class="brand" href="{{ url_for('pages.dashboard') }}"><i class="bi bi-file-earmark-person"></i> TalentScan</a>
      <nav class="nav flex-column">
        <a class="nav-link {{ 'active' if page == 'dashboard' }}" href="{{ url_for('pages.dashboard') }}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
        <a class="nav-link {{ 'active' if page == 'upload' }}" href="{{ url_for('pages.upload') }}"><i class="bi bi-cloud-arrow-up"></i> Upload resumes</a>
        <a class="nav-link {{ 'active' if page in ('candidates', 'candidate') }}" href="{{ url_for('pages.candidates') }}"><i class="bi bi-people"></i> Candidates</a>
      </nav>
      <form method="post" action="{{ url_for('auth.logout') }}" class="sidebar-user">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <span><i class="bi bi-person-circle"></i> {{ g.user.username }}</span>
        <button class="btn btn-sm btn-outline-light" type="submit">Sign out</button>
      </form>
    </div>
  </aside>
  <div class="main">
    <header class="topbar d-lg-none">
      <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Open menu"><i class="bi bi-list"></i></button>
      <strong>TalentScan</strong>
    </header>
    <main class="content">{% block content %}{% endblock %}</main>
  </div>
</div>
<div class="toast-container position-fixed top-0 end-0 p-3" id="toasts" aria-live="polite"></div>
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-body"><p class="mb-0" id="confirmText"></p></div>
    <div class="modal-footer border-0 pt-0">
      <button class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
      <button class="btn btn-danger" id="confirmOk">Delete</button>
    </div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
