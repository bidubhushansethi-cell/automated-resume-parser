{% extends "base.html" %}
{% block title %}Candidates{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>Candidates</h1><p class="text-muted mb-0" id="totalLine">Loading…</p></div>
  <div class="d-flex gap-2">
    <div class="btn-group"><button class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-download"></i> Export</button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" id="exportCsv" href="#">CSV (.csv)</a></li>
        <li><a class="dropdown-item" id="exportXlsx" href="#">Excel (.xlsx)</a></li></ul></div>
    <a class="btn btn-brand" href="{{ url_for('pages.upload') }}"><i class="bi bi-plus-lg"></i> Add resumes</a>
  </div>
</div>
<form class="panel mb-3" id="filterForm" autocomplete="off">
  <div class="row g-2 align-items-end">
    <div class="col-lg-6"><label class="form-label" for="fq">Search</label>
      <input class="form-control" id="fq" name="q" placeholder="Name, email, skill, education or employer"></div>
    <div class="col-6 col-lg-3"><label class="form-label" for="fsort">Sort by</label>
      <select class="form-select" id="fsort" name="sort"><option value="created">Newest</option><option value="name">Name</option><option value="email">Email</option><option value="experience">Experience</option></select></div>
    <div class="col-6 col-lg-3"><label class="form-label" for="forder">Order</label>
      <select class="form-select" id="forder" name="order"><option value="desc">Descending</option><option value="asc">Ascending</option></select></div>
  </div>
  <a class="d-inline-block mt-3 small" data-bs-toggle="collapse" href="#moreFilters" role="button">More filters</a>
  <div class="collapse" id="moreFilters"><div class="row g-2 mt-1">
    <div class="col-md-4"><label class="form-label" for="fname">Name</label><input class="form-control" id="fname" name="name"></div>
    <div class="col-md-4"><label class="form-label" for="femail">Email</label><input class="form-control" id="femail" name="email"></div>
    <div class="col-md-4"><label class="form-label" for="fskill">Skills (comma separated, all must match)</label><input class="form-control" id="fskill" name="skill" placeholder="python, aws"></div>
    <div class="col-md-4"><label class="form-label" for="fedu">Education</label><input class="form-control" id="fedu" name="education" placeholder="B.Tech, university"></div>
    <div class="col-md-4"><label class="form-label" for="fcat">Skill category</label>
      <select class="form-select" id="fcat" name="category"><option value="">Any</option>{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></div>
    <div class="col-6 col-md-2"><label class="form-label" for="fmin">Min years</label><input class="form-control" type="number" min="0" step="0.5" id="fmin" name="min_experience"></div>
    <div class="col-6 col-md-2"><label class="form-label" for="fmax">Max years</label><input class="form-control" type="number" min="0" step="0.5" id="fmax" name="max_experience"></div>
  </div></div>
  <div class="mt-3"><button class="btn btn-brand btn-sm" type="submit">Apply</button> <button class="btn btn-light btn-sm" type="button" id="resetBtn">Reset</button></div>
</form>
<div class="panel p-0">
  <div class="table-responsive"><table class="table table-hover align-middle mb-0">
    <thead><tr><th>Candidate</th><th>Skills</th><th class="d-none d-md-table-cell">Education</th><th>Experience</th><th class="text-end">Actions</th></tr></thead>
    <tbody id="candRows"></tbody></table></div>
  <div class="d-flex justify-content-between align-items-center p-3 border-top"><div class="small text-muted" id="pageInfo"></div><nav><ul class="pagination pagination-sm mb-0" id="pager"></ul></nav></div>
</div>
{% endblock %}
