<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · TalentScan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body class="login-body">
  <form method="post" class="login-card" autocomplete="on">
    <div class="brand text-dark mb-1"><i class="bi bi-file-earmark-person"></i> TalentScan</div>
    <p class="text-muted mb-4">Sign in to review and manage candidates.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="alert alert-{{ cat }} py-2" role="alert">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="username">Username</label>
    <input class="form-control mb-3" id="username" name="username" required autofocus autocomplete="username">
    <label class="form-label" for="password">Password</label>
    <input class="form-control mb-4" id="password" name="password" type="password" required autocomplete="current-password">
    <button class="btn btn-brand w-100" type="submit">Sign in</button>
  </form>
</body>
</html>
