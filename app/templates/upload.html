{% extends "base.html" %}
{% block title %}Upload resumes{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Upload resumes</h1>
  <p class="text-muted mb-0">PDF or DOCX, up to {{ max_mb }} MB each, {{ max_files }} files at a time.</p></div></div>
<div class="panel">
  <label class="dropzone" id="dropzone" for="fileInput">
    <i class="bi bi-cloud-arrow-up"></i>
    <strong>Drop resumes here or choose files</strong>
    <span class="text-muted">Each file is read, parsed and added to the candidate list.</span>
  </label>
  <input type="file" id="fileInput" class="visually-hidden" accept=".pdf,.docx" multiple
         data-max-mb="{{ max_mb }}" data-max-files="{{ max_files }}">
  <ul class="file-list" id="fileList"></ul>
  <div class="progress my-3 d-none" id="progressWrap" style="height:10px"><div class="progress-bar" id="progressBar" style="width:0"></div></div>
  <div class="d-flex gap-2">
    <button class="btn btn-brand" id="uploadBtn" disabled><span class="spinner-border spinner-border-sm d-none" id="uploadSpin"></span> Upload and parse</button>
    <button class="btn btn-light" id="clearBtn" disabled>Clear</button>
  </div>
</div>
<div class="panel mt-3 d-none" id="resultsPanel"><h2>Results</h2><ul class="file-list" id="results"></ul></div>
{% endblock %}
